plugins {
    id 'com.android.application'
}

android {
    namespace 'local.mintv'
    compileSdk 34

    defaultConfig {
        applicationId "local.mintv"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // UI: RecyclerView for the channel grid. No AppCompat/Material needed - activities
    // extend android.app.Activity, which keeps cold start and APK size down.
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Networking: OkHttp for the guest channel endpoint, logos and Media3 data sources.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Playback: ExoPlayer + DASH + UI. media3-exoplayer alone does not parse DASH.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.1'
}
